name: Actualizar datos

on:
  schedule:
    - cron: "0 6 * * *"   # cada día a las 06:00 UTC
  workflow_dispatch:       # también se puede lanzar a mano

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerar datos desde fuentes reales
        run: node scripts/update-data.mjs

      - name: Publicar cambios
        run: |
          git config user.name "voltieri-bot"
          git config user.email "bot@voltieri.example"
          git add web/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "data: actualizar snapshots ($(date -u +%Y-%m-%d))"
            git push
          fi
